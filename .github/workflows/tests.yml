name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ignis
          POSTGRES_USER: ignis
          POSTGRES_PASSWORD: ignis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ignis -d ignis"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ignis:ignis_test@localhost:5432/ignis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: alembic upgrade head && alembic check
      - run: python -m pytest -q
      - run: alembic downgrade base && alembic upgrade head && alembic check
