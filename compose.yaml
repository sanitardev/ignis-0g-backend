services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ignis
      POSTGRES_USER: ignis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ignis_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignis -d ignis"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
